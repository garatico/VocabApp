# The web app is deployed as a static site: `npm run build:static` writes plain files to dist/
# (the app, one JSONL per language, photos, emoji), and Render's CDN serves them. There is no Node
# process, so there is nothing to run out of memory — the old web-service setup held every language
# in RAM and kept being restarted for exceeding a small instance's limit.
#
# The admin panel is not part of this deploy (it is dev-only and needs the API).
services:
  - type: web
    runtime: static
    name: vocab-app-static
    buildCommand: npm install --include=dev && NODE_OPTIONS=--max-old-space-size=384 npm run build:static
    staticPublishPath: dist
    headers:
      # Hashed bundles never change under the same name.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The service worker and manifest must be revalidated or an update never reaches anyone.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # The pages carry their Content Security Policy as a <meta> tag (src/server/lib/csp.ts); these
      # are the parts only a response header can say. Policies add up, so the meta tag still applies.
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
