name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (truncation / null-byte check)
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Typecheck (client + server)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
