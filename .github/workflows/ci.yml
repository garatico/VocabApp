name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node:
    name: App (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (truncation / null-byte check)
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Typecheck (client + server)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    # PR-only, and gated on the node job passing first — browser install +
    # real page loads make this the slowest job in the workflow, so it isn't
    # worth paying on every push, or before the cheaper checks above have
    # already passed.
    if: github.event_name == 'pull_request'
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
