<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Quick Vocab Quiz</title>
<!-- Shared tokens -->
<link rel="stylesheet" href="/styles/shared/variables.css"/>
<link rel="stylesheet" href="/styles/shared/reset.css"/>
<!-- App styles -->
<link rel="stylesheet" href="/styles/app/animations.css"/>
<link rel="stylesheet" href="/styles/app/transitions.css"/>
<link rel="stylesheet" href="/styles/app/spinner.css"/>
<link rel="stylesheet" href="/styles/app/theme-toggle.css"/>
<link rel="stylesheet" href="/styles/app/buttons.css"/>
<link rel="stylesheet" href="/styles/app/selects.css"/>
<link rel="stylesheet" href="/styles/app/mode-tabs.css"/>
<link rel="stylesheet" href="/styles/app/controls-bar.css"/>
<link rel="stylesheet" href="/styles/app/class-filter.css"/>
<link rel="stylesheet" href="/styles/app/domain-filter.css"/>
<link rel="stylesheet" href="/styles/app/toast.css"/>
<link rel="stylesheet" href="/styles/app/feedback.css"/>
<link rel="stylesheet" href="/styles/app/progress.css"/>
<link rel="stylesheet" href="/styles/app/quiz.css"/>
<link rel="stylesheet" href="/styles/app/recall.css"/>
<link rel="stylesheet" href="/styles/app/summary.css"/>
<link rel="stylesheet" href="/styles/app/table.css"/>
<link rel="stylesheet" href="/styles/app/picture.css"/>
<link rel="stylesheet" href="/styles/app/conjugation.css"/>
<link rel="stylesheet" href="/styles/app/tooltip.css"/>
<link rel="stylesheet" href="/styles/app/responsive.css"/>

</head>


<body>
  <!-- Loading Spinner -->
  <div id="loadingSpinner">
    <div class="spinner"></div>
    <p>Loading vocabulary...</p>
  </div>

  <!-- Error Message -->
  <div id="errorMessage" style="display:none" role="alert" aria-live="polite">
    <span class="error-icon">⚠️</span>
    <span class="error-text"></span>
    <button type="button" onclick="closeError()" aria-label="Close error">×</button>
  </div>

  <main>
    <button id="themeToggle" aria-label="Toggle theme">☾</button>

    <!-- Mode Tabs -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="table">Table</button>
      <button class="mode-tab" data-mode="recall">Recall</button>
      <button class="mode-tab" data-mode="single">Single Word</button>
      <button class="mode-tab" data-mode="picture">Picture Quiz</button>
      <button class="mode-tab" data-mode="conjugation">Conjugation</button>
    </div>

    <div id="controls">
      <div id="controls-top">
        <div class="control-group">
          <label>Language</label>

          <select id="langSelect">
            <option value="spanish">Spanish</option>
            <option value="portuguese">Portuguese</option>
            <option value="italian">Italian</option>
            <option value="french">French</option>
        </select>



        </div>

        <div class="control-group">
          <label>Top words</label>
          <div class="size-row">
            <select id="sizeSelect">
              <option value="100">Top 100</option>
              <option value="250">Top 250</option>
              <option value="500">Top 500</option>
              <option value="1000" selected>Top 1000</option>
              <option value="custom">Custom…</option>
            </select>
            <input type="number" id="sizeCustom" min="1" max="9999" placeholder="e.g. 75" style="display:none;"/>
          </div>
        </div>

        <label>Randomize</label>
        <input type="checkbox" id="randomizeWords"/>


        <button id="startBtn">Start Quiz</button>
      </div>

      <div id="classFilter">
        <span class="filter-section-label">Part of Speech</span>
        <button type="button" id="selectAllClasses">All</button>
        <button type="button" id="selectNoneClasses">None</button>
        <label><input type="checkbox" value="verb" checked> Verbs</label>
        <label><input type="checkbox" value="noun" checked> Nouns</label>
        <label><input type="checkbox" value="adjective" checked> Adjectives</label>
        <label><input type="checkbox" value="adverb" checked> Adverbs</label>
        <label><input type="checkbox" value="pronoun" checked> Pronouns</label>
        <label><input type="checkbox" value="preposition" checked> Prepositions</label>
        <label><input type="checkbox" value="conjunction" checked> Conjunctions</label>
        <label><input type="checkbox" value="article" checked> Articles</label>
      </div>

      <!-- Conjugation-mode controls: shown only when Conjugation tab is active -->
      <div id="conjModeControls" style="display:none">
        <span class="filter-section-label">Display</span>
        <div class="conj-display-toggle" id="conjDisplayToggle">
          <button class="conj-toggle-btn" data-mode="target">Spanish</button>
          <button class="conj-toggle-btn active" data-mode="both">Spanish + English</button>
          <button class="conj-toggle-btn" data-mode="english">English</button>
        </div>
        <span class="filter-section-label">Tense</span>
        <select id="conjTenseSelect"><!-- populated by JS based on language --></select>
        <!-- Second row: pronoun form toggles (populated by JS) -->
        <div id="conjPronounRow" class="conj-pronoun-row">
          <span class="filter-section-label">Forms</span>
          <button type="button" id="conjFormsAll">All</button>
          <button type="button" id="conjFormsNone">None</button>
          <div id="conjPronounToggles" class="conj-pronoun-toggles"></div>
        </div>
      </div>

      <!-- Picture-mode controls: shown only when Picture Quiz tab is active -->
      <div id="pictureModeControls" style="display:none">
        <span class="filter-section-label">Quiz Style</span>
        <div class="conj-display-toggle" id="pictureSubMode">
          <button class="conj-toggle-btn active" data-mode="type">Type the Word</button>
          <button class="conj-toggle-btn" data-mode="click">Click the Picture</button>
        </div>
      </div>

      <div id="domainFilterWrap">
        <div id="domainFilterHeader">
          <span id="domainFilterLabel">Domains <span id="domainFilterCount"></span></span>
          <div id="domainFilterActions">
            <button type="button" id="selectAllDomains">All</button>
            <button type="button" id="selectNoneDomains">None</button>
            <button type="button" id="domainFilterToggle" aria-expanded="false">▾</button>
          </div>
        </div>
        <div id="domainFilter" hidden>
          <div class="domain-group">
            <span class="domain-group-label">Mind &amp; Character</span>
            <label><input type="checkbox" value="ability" checked> Ability</label>
            <label><input type="checkbox" value="clarity" checked> Clarity</label>
            <label><input type="checkbox" value="cognition" checked> Cognition</label>
            <label><input type="checkbox" value="confidence" checked> Confidence</label>
            <label><input type="checkbox" value="desire" checked> Desire</label>
            <label><input type="checkbox" value="emotion" checked> Emotion</label>
            <label><input type="checkbox" value="feelings" checked> Feelings</label>
            <label><input type="checkbox" value="hope" checked> Hope</label>
            <label><input type="checkbox" value="impression" checked> Impression</label>
            <label><input type="checkbox" value="mind" checked> Mind</label>
            <label><input type="checkbox" value="perception" checked> Perception</label>
            <label><input type="checkbox" value="potential" checked> Potential</label>
            <label><input type="checkbox" value="truth" checked> Truth</label>
          </div>
          <div class="domain-group">
            <span class="domain-group-label">People &amp; Society</span>
            <label><input type="checkbox" value="age" checked> Age</label>
            <label><input type="checkbox" value="business" checked> Business</label>
            <label><input type="checkbox" value="communication" checked> Communication</label>
            <label><input type="checkbox" value="education" checked> Education</label>
            <label><input type="checkbox" value="identity" checked> Identity</label>
            <label><input type="checkbox" value="language" checked> Language</label>
            <label><input type="checkbox" value="law" checked> Law</label>
            <label><input type="checkbox" value="learning" checked> Learning</label>
            <label><input type="checkbox" value="security" checked> Security</label>
            <label><input type="checkbox" value="work" checked> Work</label>
          </div>
          <div class="domain-group">
            <span class="domain-group-label">Body &amp; Physical</span>
            <label><input type="checkbox" value="aesthetics" checked> Aesthetics</label>
            <label><input type="checkbox" value="appearance" checked> Appearance</label>
            <label><input type="checkbox" value="cleanliness" checked> Cleanliness</label>
            <label><input type="checkbox" value="clothes" checked> Clothes</label>
            <label><input type="checkbox" value="drinks" checked> Drinks</label>
            <label><input type="checkbox" value="food" checked> Food</label>
            <label><input type="checkbox" value="health" checked> Health</label>
            <label><input type="checkbox" value="height" checked> Height</label>
            <label><input type="checkbox" value="medical" checked> Medical</label>
            <label><input type="checkbox" value="physical_state" checked> Physical State</label>
            <label><input type="checkbox" value="senses" checked> Senses</label>
            <label><input type="checkbox" value="size" checked> Size</label>
            <label><input type="checkbox" value="speed" checked> Speed</label>
            <label><input type="checkbox" value="strength" checked> Strength</label>
            <label><input type="checkbox" value="temperature" checked> Temperature</label>
          </div>
          <div class="domain-group">
            <span class="domain-group-label">World &amp; Action</span>
            <label><input type="checkbox" value="events" checked> Events</label>
            <label><input type="checkbox" value="existence" checked> Existence</label>
            <label><input type="checkbox" value="location" checked> Location</label>
            <label><input type="checkbox" value="movement" checked> Movement</label>
            <label><input type="checkbox" value="occurrence" checked> Occurrence</label>
            <label><input type="checkbox" value="state" checked> State</label>
            <label><input type="checkbox" value="transport" checked> Transport</label>
            <label><input type="checkbox" value="travel" checked> Travel</label>
          </div>
          <div class="domain-group">
            <span class="domain-group-label">Abstract &amp; Logic</span>
            <label><input type="checkbox" value="condition" checked> Condition</label>
            <label><input type="checkbox" value="distinction" checked> Distinction</label>
            <label><input type="checkbox" value="freedom" checked> Freedom</label>
            <label><input type="checkbox" value="importance" checked> Importance</label>
            <label><input type="checkbox" value="necessity" checked> Necessity</label>
            <label><input type="checkbox" value="obligation" checked> Obligation</label>
            <label><input type="checkbox" value="possibility" checked> Possibility</label>
            <label><input type="checkbox" value="quality" checked> Quality</label>
            <label><input type="checkbox" value="quantity" checked> Quantity</label>
            <label><input type="checkbox" value="simplicity" checked> Simplicity</label>
          </div>
          <div class="domain-group">
            <span class="domain-group-label">Exchange &amp; Value</span>
            <label><input type="checkbox" value="giving" checked> Giving</label>
            <label><input type="checkbox" value="ownership" checked> Ownership</label>
            <label><input type="checkbox" value="possession" checked> Possession</label>
            <label><input type="checkbox" value="request" checked> Request</label>
            <label><input type="checkbox" value="search" checked> Search</label>
            <label><input type="checkbox" value="transaction" checked> Transaction</label>
            <label><input type="checkbox" value="wealth" checked> Wealth</label>
            <label><input type="checkbox" value="general" checked> General</label>
          </div>
        </div>
      </div>

    </div>

    <section id="tableArea">
      <div class="progressWrap">
        <div class="progress"><div id="tableBarTop" class="bar"></div></div>
        <div id="tableStatsTop" class="small"></div>
      </div>

      <div id="tableControls" class="controls-row">
        <select id="colsSelect" title="Columns">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
        </select>
        <button id="tableExport">Export</button>
        <button id="tableReset">Give Up</button>
      </div>
      <div id="tableWrap"></div>
      <div id="tableFeedback" class="feedback"></div>
      <div id="tableSummary" class="quiz-summary" style="display:none"></div>

      <div class="progressWrap">
        <div class="progress"><div id="tableBarBottom" class="bar"></div></div>
        <div id="tableStatsBottom" class="small"></div>
      </div>
    </section>

    <section id="recallArea" hidden>
      <div class="progressWrap">
        <div class="progress"><div id="recallBarTop" class="bar"></div></div>
        <div id="recallStatsTop" class="small"></div>
      </div>

      <div id="recallControls" class="controls-row">
        <label>
          Timer:
          <select id="recallTimer">
            <option value="0">No timer</option>
            <option value="60">1 min</option>
            <option value="180">3 min</option>
            <option value="300" selected>5 min</option>
            <option value="600">10 min</option>
            <option value="900">15 min</option>
            <option value="custom">Custom…</option>
            </select>
            <input type="number" id="recallTimerCustom" min="1" max="999" placeholder="mins" style="display:none; width:60px;"/>
        </label>
        <label>
          When time runs out:
          <select id="recallHardStop">
            <option value="false">Keep going</option>
            <option value="true">Hard stop</option>
          </select>
        </label>
      </div>
      <div id="recallWrap"></div>

      <div class="progressWrap">
        <div class="progress"><div id="recallBarBottom" class="bar"></div></div>
        <div id="recallStatsBottom" class="small"></div>
      </div>
    </section>

    <section id="quizArea" hidden>
      <div class="progressWrap">
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="statsTop" class="small"></div>
      </div>

      <div id="word" class="word"></div>
      <input id="answer" type="text" placeholder="Type English translation…" autocomplete="off"/>
      <div id="feedback" class="feedback"></div>

      <div class="controls-row">
        <button id="btnCorrect">Mark Correct</button>
        <button id="btnSkip">Skip</button>
        <button id="quizGiveUp">Give Up</button>
        <button id="ttsBtn">🔊</button>
        <button id="exportBtn">Export Progress</button>
        <button id="resetBtn">Reset Progress</button>
      </div>

      <div class="progressWrap">
        <div id="stats" class="small"></div>
      </div>
    </section>

    <section id="pictureArea" hidden>
      <div class="progressWrap">
        <div class="progress"><div id="pictureBarTop" class="bar"></div></div>
        <div id="pictureStatsTop" class="small"></div>
      </div>

      <div id="pictureWrap"></div>

      <div class="progressWrap">
        <div class="progress"><div id="pictureBarBottom" class="bar"></div></div>
        <div id="pictureStatsBottom" class="small"></div>
      </div>
    </section>

    <section id="conjugationArea" hidden>
      <div id="conjugationWrap"></div>
    </section>

    <pre id="output" class="output"></pre>
  </main>

<script type="module" src="/src/app.js"></script>
</body>
</html>
